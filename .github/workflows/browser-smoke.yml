name: Browser smoke tests

# Builds the site from the pull request and drives the result in Chromium
# (tests/browser). The PHP CI does not build the frontend, so this is the PR
# check for CSP, cookie banner and consent paths, ClientRouter navigations,
# RTL layout, search and the 404 page. No secrets are used, and every request
# that is not for the local test server is aborted by the tests.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build site and run browser smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned 2026-08-02 (same as deploy.yml)

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 pinned 2026-08-02 (same as deploy.yml)
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Astro site
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npx playwright test

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1, Node.js 24
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
