name: Site monitor

on:
  schedule:
    # Hourly. A failed run makes GitHub email the failure (scheduled-workflow
    # notifications go to the account that last changed this schedule).
    - cron: '23 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/site-monitor.yml'
      - 'scripts/monitor-sites.mjs'

permissions:
  contents: read

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check sites, endpoints, certificates and origin exposure
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned 2026-08-02

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 pinned 2026-08-02
        with:
          node-version: '24'

      - name: Run monitor
        env:
          # Reuses the deploy SSH host. GitHub masks secret values in logs and
          # the script never prints it (public repository).
          ORIGIN_HOST: ${{ secrets.REMOTE_HOST }}
        run: node scripts/monitor-sites.mjs
