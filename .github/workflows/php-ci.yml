name: PHP backend CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: php-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP 8.3 full backend suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 pinned 2026-07-08 (same as deploy.yml)

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 pinned 2026-07-08 (same as deploy.yml)
        with:
          node-version: '22'

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2 pinned (same as XinXin php-ci)
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring
          coverage: none
          tools: none
        env:
          fail-fast: true

      - name: Verify PHP runtime and required extensions
        run: php scripts/verify-php-runtime.php

      - name: Lint all PHP sources
        run: find public private scripts -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Run all PHP backend tests
        run: npm run test:php
