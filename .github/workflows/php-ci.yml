name: PHP backend CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: php-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP 8.3 full backend suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned 2026-08-02 (same as deploy.yml)

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 pinned 2026-08-02 (same as deploy.yml)
        with:
          node-version: '24'

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2 pinned (same as XinXin php-ci)
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring
          coverage: none
          tools: none
        env:
          fail-fast: true

      - name: Verify PHP runtime and required extensions
        run: php scripts/verify-php-runtime.php

      - name: Validate deployment release policy
        run: |
          bash -n scripts/deploy-release.sh
          bash -n scripts/permission-policy.sh
          bash -n scripts/test-permission-policy.sh
          npm run validate:release
          npm run validate:permissions
          npm run test:permissions
          npm run validate:runtime-identity
          npm run test:runtime-identity
          npm run validate:promotion
          npm run validate:rollback-safety
          npm run validate:release-evidence
          npm run validate:cloudflare-ranges
          npm run test:cloudflare-ranges
          npm run validate:cloudflare-audit
          npm run validate:tls-policy
          npm run validate:runtime-assets
          npm run test:runtime-assets
          npm run validate:admin-origin
          npm run validate:password-reset
          npm run validate:admin-input-session
          npm run validate:security
          npm run test:smoke

      - name: Lint all PHP sources
        run: find public private scripts -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Run all PHP backend tests
        run: npm run test:php
