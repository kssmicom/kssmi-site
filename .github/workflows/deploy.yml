name: Deploy KSSMI Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: kssmi-production
  # Never overlap production releases. A running deployment completes or rolls
  # back before the next commit can begin.
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and seal release artifact
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.release-metadata.outputs.artifact_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned 2026-08-02

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 pinned 2026-08-02
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit npm dependencies
        run: |
          # CVE-2026-59870 (js-yaml, high): no patched release exists for the
          # installed 3.x/4.x lines (gray-matter requires the js-yaml 3.x API;
          # js-yaml 4.4.0+ does not exist). Usage here is build-time parsing of
          # the repository's own content, not attacker input. Audit bar is set
          # to critical until a patched js-yaml is published, then restore high.
          npm audit --audit-level=critical

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2 pinned
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring
          coverage: none
          tools: none
        env:
          fail-fast: true

      - name: Verify PHP runtime and required extensions
        run: php scripts/verify-php-runtime.php

      - name: Validate deployment and promotion policies
        run: |
          bash -n scripts/deploy-release.sh
          bash -n scripts/permission-policy.sh
          bash -n scripts/test-permission-policy.sh
          bash -n scripts/prune-old-releases.sh
          npm run validate:release
          npm run validate:permissions
          npm run test:permissions
          npm run validate:runtime-identity
          npm run test:runtime-identity
          npm run validate:promotion
          npm run validate:rollback-safety
          npm run validate:release-evidence
          npm run validate:cloudflare-ranges
          npm run test:cloudflare-ranges
          npm run validate:cloudflare-audit
          npm run validate:tls-policy
          npm run validate:runtime-assets
          npm run test:runtime-assets
          npm run validate:admin-origin
          npm run validate:password-reset
          npm run validate:admin-input-session
          npm run validate:security
          npm run test:smoke

      - name: Require current official Cloudflare ranges
        run: npm run validate:cloudflare-ranges -- --check-remote

      - name: Lint PHP sources
        run: find public private scripts -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Test backend storage and security policies
        run: |
          bash scripts/test-email-log-migration.sh
          npm run test:vjt-capability-proof
          php scripts/test-email-log-store.php
          php scripts/test-rate-limit.php
          php scripts/test-vjt-event-authenticity.php
          php scripts/test-vjt-write-budget.php
          php scripts/test-vjt-checkpoint.php
          php scripts/test-contact-core.php
          php scripts/test-vjt-event-state.php
          php scripts/test-vjt-heartbeat.php
          php scripts/test-vjt-data-quality.php
          php scripts/test-http-security.php
          php scripts/test-reset-token-race.php
          php scripts/test-admin-session.php
          php scripts/test-short-links.php

      - name: Validate frontend policies
        run: |
          npm run validate:cache
          npm run validate:dom
          npm run validate:lcp
          npm run validate:astro-syntax
          npm run validate:translations

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Verify built runtime asset manifest
        run: |
          node scripts/read-runtime-asset-manifest.mjs dist/assets/runtime/manifest.json
          python3 scripts/ols-add-headers.py --check-manifest dist/assets/runtime/manifest.json

      - name: Generate strict CSP from built HTML
        run: node scripts/generate-csp-hashes.mjs dist

      - name: Assert built static CSP is strict
        run: |
          if sed -n '/Static HTML CSP BEGIN/,/Static HTML CSP END/p' dist/.htaccess | grep -q 'unsafe-inline'; then
            echo 'Static HTML CSP must not contain unsafe-inline'
            exit 1
          fi

      - name: Install PHPMailer
        run: |
          cd public
          composer install --no-dev --optimize-autoloader
          composer audit --locked --no-dev

      - name: Copy PHP files to dist
        run: |
          cp public/send-mail.php dist/
          cp public/email-logs.php dist/
          cp public/visitor-journey.php dist/
          cp public/404-router.php dist/
          cp public/short-link-redirect.php dist/
          cp -r public/api dist/
          cp -r public/vendor dist/

      - name: Generate secret-free build evidence
        run: node scripts/generate-build-evidence.mjs release-evidence/build

      - name: Seal immutable release artifact
        id: release-metadata
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="kssmi-release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf '%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .kssmi-artifact-release
          tar -cf kssmi-release.tar \
            .kssmi-artifact-release \
            dist private \
            scripts/deploy-release.sh \
            scripts/permission-policy.sh \
            scripts/runtime-capability-probe.php \
            scripts/prune-old-releases.sh
          sha256sum kssmi-release.tar > kssmi-release.tar.sha256

      - name: Upload sealed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1, Node.js 24
        with:
          name: ${{ steps.release-metadata.outputs.artifact_name }}
          path: |
            kssmi-release.tar
            kssmi-release.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1, Node.js 24
        with:
          name: kssmi-build-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/build
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    name: Deploy and verify production
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned

      - name: Download exact sealed release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0, Node.js 24
        with:
          name: ${{ needs.build-release.outputs.artifact-name }}
          path: release-artifact

      - name: Verify and extract sealed release artifact
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum -c kssmi-release.tar.sha256
          tar -xf kssmi-release.tar -C ..
          test "$(cat ../.kssmi-artifact-release)" = "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Deploy verified artifact to production
        uses: ./.github/actions/deploy-environment
        with:
          environment-name: production
          site-url: https://kssmi.com
          site-host: kssmi.com
          private-root: /home/kssmi.com
          site-user: kssmi4374
          site-group: kssmi4374
          remote-host: ${{ secrets.REMOTE_HOST }}
          remote-user: ${{ secrets.REMOTE_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          smoke-access-client-id: ${{ secrets.SMOKE_ACCESS_CLIENT_ID }}
          smoke-access-client-secret: ${{ secrets.SMOKE_ACCESS_CLIENT_SECRET }}
          smoke-admin-password: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  release-evidence:
    name: Publish release evidence and final signoff
    needs: [build-release, deploy-production]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout evidence policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned

      - name: Download build evidence
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0, Node.js 24
        with:
          name: kssmi-build-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-input/build

      - name: Download production evidence
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0, Node.js 24
        with:
          name: kssmi-production-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-input/production

      - name: Collect GitHub checks and assemble final evidence
        run: node scripts/collect-release-evidence.mjs evidence-input release-evidence/final
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload final evidence package
        id: final-evidence-upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1, Node.js 24
        with:
          name: kssmi-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/final
          if-no-files-found: error
          retention-days: 90

      - name: Enforce final release signoff
        if: always()
        run: node scripts/enforce-release-evidence.mjs release-evidence/final/release-evidence.json
