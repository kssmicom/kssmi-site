name: Deploy KSSMI Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: kssmi-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 pinned 2026-07-08

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 pinned 2026-07-08
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        # Astro 7 and its patched transitive dependencies are required; HIGH
        # vulnerabilities continue to block deployment.

      - name: Lint PHP sources
        run: find public private -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate cache policy and runtime fingerprints
        run: npm run validate:cache

      - name: Validate DOM regression policy
        run: npm run validate:dom

      - name: Validate LCP and video loading policy
        run: npm run validate:lcp

      - name: Validate Astro template syntax
        run: npm run validate:astro-syntax

      - name: Validate translation loading regressions
        run: npm run validate:translations

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Generate strict CSP from built HTML
        run: node scripts/generate-csp-hashes.mjs dist

      - name: Assert built static CSP is strict
        run: |
          if sed -n '/Static HTML CSP BEGIN/,/Static HTML CSP END/p' dist/.htaccess | grep -q 'unsafe-inline'; then
            echo 'Static HTML CSP must not contain unsafe-inline'
            exit 1
          fi

      - name: Install PHPMailer
        run: |
          cd public
          composer install --no-dev --optimize-autoloader
          composer audit --locked --no-dev

      - name: Copy PHP files to dist
        run: |
          cp public/send-mail.php dist/
          cp public/email-logs.php dist/

          cp public/visitor-journey.php dist/

          cp public/404-router.php dist/
          cp -r public/api dist/
          cp -r public/vendor dist/

      - name: Deploy rate-limit.php to private/ (outside webroot, P3-3)
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0 pinned 2026-07-08
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "private/rate-limit.php"
          target: "/home/kssmi.com"

      - name: Deploy to Hetzner Server
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447  # v6.0.1 pinned 2026-07-06 (was @main — supply-chain risk)
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "dist/"
          TARGET: "/home/kssmi.com/public_html"
          # Private email data now lives in /home/kssmi.com, above public_html.
          # Do not preserve legacy webroot copies of logs, credentials or tokens.
          ARGS: "-avz --delete --exclude=api/vjt_data"

      - name: Set file permissions
        uses: appleboy/ssh-action@068c0c7a4e59a5ae12fb7cb454b05735d830c82b  # v1.2.5+ pinned 2026-07-06 (was @master — supply-chain risk)
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/kssmi.com/public_html
            SITE_USER=kssmi4374
            SITE_GROUP=kssmi4374
            SITE_OWNER="$SITE_USER:$SITE_GROUP"

            # Set ownership, including dotfiles such as .htaccess.
            chown -R "$SITE_OWNER" . 2>/dev/null || sudo chown -R "$SITE_OWNER" .

            # Set directory permissions
            find . -type d -exec chmod 755 {} \; 2>/dev/null || true

            # Set file permissions
            find . -type f -exec chmod 644 {} \; 2>/dev/null || true

            # Make PHP files executable
            find . -name "*.php" -exec chmod 755 {} \; 2>/dev/null || true

            # Email data and credentials live above public_html, outside web access.
            PRIVATE_ROOT=/home/kssmi.com
            touch "$PRIVATE_ROOT/email-logs.json" 2>/dev/null || true
            test -s "$PRIVATE_ROOT/email-logs.json" || echo '[]' > "$PRIVATE_ROOT/email-logs.json" 2>/dev/null || true
            touch "$PRIVATE_ROOT/.email_logs_password" 2>/dev/null || true
            touch "$PRIVATE_ROOT/.email_reset_tokens.json" 2>/dev/null || true

            # Set writable permissions for data files (PHP needs to write to these)
            # chmod 640 (was 666): owner read/write, group read, other none.
            # PHP-FPM runs as kssmi4374:kssmi4374 — owner can write, others can't.
            # 666 was overly permissive: let any user on the server read/write these
            # sensitive files (email reset tokens, password hash).
            chmod 640 "$PRIVATE_ROOT/email-logs.json" "$PRIVATE_ROOT/.email_logs_password" "$PRIVATE_ROOT/.email_reset_tokens.json" 2>/dev/null || true

            # VJT SQLite store — lives OUTSIDE public_html (P2-4 of security-004.md)
            # The actual data file (vjt.sqlite + WAL/SHM) is NOT touched by deploy:
            #   1. easingthemes/ssh-deploy --exclude=api/vjt_data skips any directory
            #      called vjt_data inside dist/ (it lives above public_html now).
            #   2. The Mkdir below ensures the destination directory exists with
            #      correct ownership so PHP can create vjt.sqlite on first init.
            mkdir -p /home/kssmi.com/vjt_data 2>/dev/null || sudo mkdir -p /home/kssmi.com/vjt_data 2>/dev/null || true
            chown "$SITE_OWNER" /home/kssmi.com/vjt_data 2>/dev/null || sudo chown "$SITE_OWNER" /home/kssmi.com/vjt_data
            chmod 750 /home/kssmi.com/vjt_data 2>/dev/null || sudo chmod 750 /home/kssmi.com/vjt_data 2>/dev/null || true

            # Set ownership for data files
            chown "$SITE_OWNER" "$PRIVATE_ROOT/email-logs.json" "$PRIVATE_ROOT/.email_logs_password" "$PRIVATE_ROOT/.email_reset_tokens.json" 2>/dev/null || sudo chown "$SITE_OWNER" "$PRIVATE_ROOT/email-logs.json" "$PRIVATE_ROOT/.email_logs_password" "$PRIVATE_ROOT/.email_reset_tokens.json"

            # GSC credentials stay outside public_html and must be readable only
            # by the real LiteSpeed PHP account. If the manually uploaded file
            # exists, make a permission regression fail the deploy visibly.
            GSC_DIR="$PRIVATE_ROOT/private/gsc"
            GSC_JSON="$GSC_DIR/google-service-account.json"
            if [ -f "$GSC_JSON" ]; then
              chown -R "$SITE_OWNER" "$GSC_DIR" 2>/dev/null || sudo chown -R "$SITE_OWNER" "$GSC_DIR"
              chmod 700 "$GSC_DIR" 2>/dev/null || sudo chmod 700 "$GSC_DIR"
              chmod 600 "$GSC_JSON" 2>/dev/null || sudo chmod 600 "$GSC_JSON"
              if [ "$(id -un)" = "$SITE_USER" ]; then
                test -r "$GSC_JSON"
              else
                sudo -u "$SITE_USER" test -r "$GSC_JSON"
              fi
              echo "GSC JSON readable by $SITE_USER: OK"
            else
              echo "GSC JSON not present; skipping credential permission check."
            fi

      - name: Purge Cloudflare after atomic deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo 'WARNING: Cloudflare purge skipped; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID before enabling HTML edge caching.'
            exit 0
          fi

          response="$(curl --fail-with-body -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"success":true'

          # Re-warm the most important HTML documents after the purge.
          for path in / /it/ /es/ /fr/ /de/ /pt/ /ru/ /ja/ /tr/ /ar/ /ko/ /zh/ /hi/ /vi/ /jv/ /ms/ /tg/; do
            curl -ksS -o /dev/null "https://kssmi.com${path}"
          done

      - name: Verify deployed security controls
        shell: bash
        run: |
          set -euo pipefail

          check_status() {
            local url="$1"
            local expected_codes="$2"
            local actual
            actual="$(curl -ksS -o /dev/null -w '%{http_code}' "$url")"
            echo "$url -> $actual (expected one of: $expected_codes)"
            [[ " $expected_codes " == *" $actual "* ]]
          }

          assert_single_cache_control() {
            local url="$1"
            local expected="$2"
            local response_headers values count
            response_headers="$(curl -ksS -D - -o /dev/null -H 'Cache-Control: no-cache' "$url")"
            values="$(printf '%s\n' "$response_headers" | awk 'BEGIN{IGNORECASE=1} /^Cache-Control:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}')"
            count="$(printf '%s\n' "$values" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "$url -> Cache-Control: $values"
            if [ "$count" != '1' ]; then
              echo "ERROR: expected exactly one Cache-Control header, found $count"
              exit 1
            fi
            printf '%s' "$values" | grep -Fqi "$expected"
          }

          headers="$(curl -ksS -D - -o /dev/null -H 'Cache-Control: no-cache' "https://kssmi.com/?deploy-security-check=$(date +%s)")"
          echo "$headers"
          csp="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^Content-Security-Policy:/ {print}')"
          if printf '%s' "$csp" | grep -qi 'unsafe-inline'; then
            echo 'WARNING: Cloudflare layer CSP has unsafe-inline (intentional safety net).'
            echo 'Origin .htaccess CSP is strict hash-based — verified during build step.'
          else
            echo 'OK: online CSP is strict (no unsafe-inline detected at edge).'
          fi

          check_status 'https://kssmi.com/email-logs.php' 302
          check_status 'https://kssmi.com/visitor-journey.php' 302
          check_status 'https://kssmi.com/ip-debug.php' 404
          check_status 'https://kssmi.com/php-status.php' 404
          check_status 'https://kssmi.com/vjt-db-setup.php' 404
          check_status 'https://kssmi.com/.env' 404
          # The legacy webroot file has been removed. Depending on OLS routing,
          # a protected/missing sensitive path may correctly return 403 or 404.
          check_status 'https://kssmi.com/email-logs.json' '403 404'
          check_status 'https://kssmi.com/composer.json' 403

          assert_single_cache_control 'https://kssmi.com/' 's-maxage=600'
          assert_single_cache_control 'https://kssmi.com/assets/runtime/cookie-banner.5107dfdbd150.js' 'immutable'
          assert_single_cache_control 'https://kssmi.com/api/track-pageview.php' 'no-store'
          assert_single_cache_control 'https://kssmi.com/api/contact-intent.php' 'no-store'

      - name: Deployment Complete
        run: |
          echo "Deployment complete!"
          echo "Visit: https://kssmi.com"
