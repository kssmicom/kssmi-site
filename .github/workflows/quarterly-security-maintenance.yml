name: Quarterly security maintenance

on:
  schedule:
    - cron: '37 3 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring
          coverage: none
          tools: none
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev
      - run: |
          cd public
          composer install --no-dev --prefer-dist --no-interaction
          composer audit --locked --no-dev
      - run: npm run test:php
      - run: npm run validate:security && npm run validate:cloudflare-ranges && npm run test:smoke
      - run: |
          echo 'Quarterly dependency audit and security regression suite passed.' >> "$GITHUB_STEP_SUMMARY"
