name: Monthly Cloudflare snapshot PR

on:
  schedule:
    - cron: '23 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-cloudflare-snapshot
  cancel-in-progress: false

jobs:
  refresh-and-propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      # The server refreshes its live snapshot weekly and CI stamps the
      # repository copy, so a PR is only needed when Cloudflare actually
      # changes its ranges.
      - name: Compare repository ranges with Cloudflare
        id: compare
        run: |
          set +e
          npm run -s stamp:cloudflare-ranges -- --check-only
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            echo 'Cloudflare ranges unchanged; no PR needed.' >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - if: steps.compare.outputs.changed == 'true'
        run: npm run update:cloudflare-ranges
      - if: steps.compare.outputs.changed == 'true'
        run: npm run test:cloudflare-ranges && npm run validate:cloudflare-ranges -- --check-remote
      - name: Create reviewable update PR
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- private/cloudflare-ip-ranges.json; then
            echo 'Snapshot already current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/cloudflare-snapshot-$(date -u +%Y-%m)"
          # A rerun in the same month finds the branch already on GitHub. The
          # checkout tracks only main, so name the expected remote commit
          # (empty = must not exist); a bare --force-with-lease is rejected as
          # "stale info", and a concurrent change is still refused.
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          git checkout -B "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add private/cloudflare-ip-ranges.json
          git commit -m 'chore: refresh Cloudflare origin ranges'
          git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" != 0 ]; then
            echo "Snapshot PR for $branch is already open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The PHP consumer rejects a snapshot older than 45 days, so a refresh
          # that never reaches main must fail this run instead of passing silently.
          if ! gh pr create --base main --head "$branch" --title 'chore: refresh Cloudflare origin ranges' --body 'Automated monthly snapshot refresh. Review the range diff, then merge normally; deployment remains protected by the regular release workflow.'; then
            echo "::error::Could not open the snapshot PR. Open a PR from $branch manually and deploy it before the live snapshot is 45 days old."
            echo "Snapshot PR could not be opened; $branch was pushed and needs a manual PR." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
