name: Audit Cloudflare IP ranges

on:
  push:
    branches: [ main ]
  schedule:
    # Weekly on Monday. Push runs bind release evidence to the exact candidate
    # commit; a manual run remains available after planned range changes.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-range-audit
  cancel-in-progress: true

jobs:
  compare-official-ranges:
    name: Compare repository snapshot with Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 pinned 2026-08-02

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 pinned 2026-08-02
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate snapshot and compare official ranges
        run: |
          npm run test:cloudflare-ranges
          npm run validate:cloudflare-ranges -- --check-remote
